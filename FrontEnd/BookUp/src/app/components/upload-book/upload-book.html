<form class="form-container">
  <div class="form-field">
    <label for="bookName">Nombre del libro:</label>
    <input type="text" id="bookName" name="bookName" value="">
  </div>
  <div class="form-field">
    <label for="description">Descripcion:</label>
    <input type="text" id="description" name="description" value="">
  </div>
  <div class="form-field">
    <label for="review">Reseña:</label>
    <input type="text" id="review" name="review" value="">
  </div>
  <div class="form-field">
    <label for="bookFile">Subir:</label>
    <input type="file" id="bookFile" name="bookFile" value="">
  </div>
  <div class="form-field buttons">
    <button type="submit">Realizar</button>
    <button type="button">Cancelar</button>
  </div>
</form>
