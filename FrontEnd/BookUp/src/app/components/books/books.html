@if (isLoading()) {
  <div class="d-flex justify-content-center align-items-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Cargando libros...</span>
    </div>
  </div>
}
@else if (books().length === 0) {
  <div class="empty-state py-5">
    <img src="/images/upload-cloud.png" alt="subir">
    <button type="button" class="btn-custom" routerLink="/myBooks/uploadBook">Subir</button>
  </div>
}
@else {
  <div class="container py-4">
    <!-- Barra superior responsiva -->
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
      <h4 class="fw-bold mb-0">Mis Libros</h4>

      <div class="d-flex flex-wrap align-items-center gap-2 header-actions">
        @if (!selectionMode()) {
          <button type="button" class="btn btn-outline-danger rounded-pill px-3" (click)="toggleSelectionMode()">
            Seleccionar
          </button>
          <button type="button" class="btn-custom btn-header" routerLink="/myBooks/uploadBook">
            + Subir otro libro
          </button>
        } @else {
          <button type="button" class="btn btn-light rounded-pill px-3" (click)="toggleSelectionMode()">
            Cancelar
          </button>
          <button
            type="button"
            class="btn btn-danger rounded-pill px-4 fw-semibold"
            [disabled]="selectedIds().length === 0"
            (click)="openDeleteModal()"
          >
            Borrar ({{ selectedIds().length }})
          </button>
        }
      </div>
    </div>

    <!-- Cuadrícula de libros -->
    <div class="d-flex flex-wrap gap-4">
      @for (item of books(); track item.id) {
        <app-book-card
          [book]="item"
          [selectionMode]="selectionMode()"
          [isSelected]="selectedIds().includes(item.id)"
          (selectBook)="openBookDetails($event)"
          (toggleSelect)="toggleBookSelection($event)"
        />
      }
    </div>
  </div>
}

@if (showDeleteModal()) {
  <div class="modal-backdrop fade show"></div>

  <div class="modal fade show d-block" tabindex="-1" role="dialog" (click)="closeDeleteModal()">
    <div class="modal-dialog modal-dialog-centered modal-sm" role="document" (click)="$event.stopPropagation()">
      <div class="modal-content border-0 shadow-lg rounded-4 p-3 text-center">

        <div class="d-flex justify-content-end">
          <button type="button" class="btn-close" aria-label="Close" (click)="closeDeleteModal()"></button>
        </div>

        <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-circle p-3">
          <span class="fs-2 lh-1">🗑️</span>
        </div>

        <div class="modal-body pt-0 pb-3">
          <h5 class="fw-bold text-dark mb-2">¿Eliminar libros?</h5>
          <p class="text-body-secondary mb-0">
            Se eliminarán <strong>{{ selectedIds().length }}</strong> libro(s) seleccionado(s).
          </p>
        </div>

        <div class="modal-footer border-0 justify-content-center gap-2 pt-0 pb-2">
          <button type="button" class="btn btn-light rounded-pill px-4" (click)="closeDeleteModal()" [disabled]="isDeleting()">
            Cancelar
          </button>
          <button type="button" class="btn btn-danger rounded-pill px-4 fw-semibold" (click)="executeBulkDelete()" [disabled]="isDeleting()">
            {{ isDeleting() ? 'Eliminando...' : 'Eliminar' }}
          </button>
        </div>

      </div>
    </div>
  </div>
}
