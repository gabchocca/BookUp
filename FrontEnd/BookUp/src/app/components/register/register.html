<div class="form-container">
  <form (submit)="onSubmit($event)">
    <div class="form-field">
      <label for="usuario">Usuario:</label>
      <input
        type="text"
        id="usuario"
        [formField]="registerForm.username"
        placeholder="El usuario debe ser único"
      />
    </div>

    <div class="form-field">
      <label for="email">Correo electrónico:</label>
      <input
        type="email"
        id="email"
        [formField]="registerForm.email"
      />
    </div>

    <div class="form-field">
      <label for="password">Contraseña:</label>
      <input
        type="password"
        id="password"
        [formField]="registerForm.password"
      />
    </div>

    <div class="form-field">
      <label for="name">Nombre:</label>
      <input
        type="text"
        id="name"
        [formField]="registerForm.name"
      />
    </div>

    <div class="form-field buttons">
      <button type="submit" [disabled]="registerForm().invalid() || isLoading()">
        {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
      </button>
      <button type="button" (click)="onCancel()">Cancelar</button>
    </div>
  </form>

  <a routerLink="../login">¿Ya tienes una cuenta? Inicia sesión</a>
</div>

<dialog #errorDialog class="error-popup">
  <div class="popup-content">
    <h3>⚠️ No se pudo completar el registro</h3>
    <p>{{ errorMessage() }}</p>
    <button type="button" (click)="cerrarPopup()">Entendido</button>
  </div>
</dialog>
