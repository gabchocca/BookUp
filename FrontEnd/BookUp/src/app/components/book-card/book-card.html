<button
  type="button"
  class="card h-100 border-0 shadow-sm text-start p-0 overflow-hidden bg-white"
  style="width: 180px;"
  (click)="onCardClick()"
>
  @if (!imageError()) {
    <img
      [src]="coverUrl()"
      [alt]="book().title || 'Portada del libro'"
      (error)="onImageError()"
      class="card-img-top object-fit-cover bg-light w-100"
      height="240"
    />
  } @else {
    <div class="d-flex flex-column align-items-center justify-content-center bg-secondary-subtle text-secondary w-100" style="height: 240px;">
      <span class="fs-1">📖</span>
      <small>Sin portada</small>
    </div>
  }

  <div class="card-body p-2 w-100">
    <h6 class="card-title text-truncate fw-bold text-dark mb-0" [title]="book().title">
      {{ book().title || 'Sin título' }}
    </h6>
  </div>
</button>
