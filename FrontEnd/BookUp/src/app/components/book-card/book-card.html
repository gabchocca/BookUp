<div
  role="button"
  tabindex="0"
  class="card h-100 shadow-sm text-start p-0 overflow-hidden bg-white position-relative"
  [class.border-primary]="isSelected()"
  [class.border-2]="isSelected()"
  [class.border-0]="!isSelected()"
  [class.opacity-75]="selectionMode() && !isSelected()"
  style="width: 180px; max-width: 180px; cursor: pointer;"
  (click)="onCardClick()"
>
  @if (selectionMode()) {
    <span
      class="position-absolute top-0 start-0 m-2 badge rounded-pill z-2"
      [class.bg-primary]="isSelected()"
      [class.bg-secondary]="!isSelected()"
    >
      {{ isSelected() ? '✓' : '○' }}
    </span>
  }

  @if (!imageError()) {
    <img
      [src]="coverUrl()"
      [alt]="book().title || 'Portada del libro'"
      (error)="onImageError()"
      class="card-img-top object-fit-cover bg-light w-100"
      height="240"
    />
  } @else {
    <div class="d-flex flex-column align-items-center justify-content-center bg-secondary-subtle text-secondary w-100" style="height: 240px;">
      <span class="fs-1">📖</span>
      <small>Sin portada</small>
    </div>
  }

  <div class="card-body p-2 w-100">
    <h6 class="card-title text-truncate fw-bold text-dark mb-0" [title]="book().title">
      {{ book().title || 'Sin título' }}
    </h6>
  </div>
</div>
