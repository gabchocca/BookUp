[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gabchocca", email = "61342766@continental.edu.pe" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.4.0",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2,bcrypt]>=0.4.2",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf>=2.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
